<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Statslock Companion</title>
<style>
  :root { --bg: rgba(14,12,10,var(--op,.94)); --fg: #f2ebe0; --muted: #a39887; --accent: #e3a33b; --ally: #4fb3a9; --enemy: #d9604c; --line: rgba(255,255,255,.08); }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
  header b { color: var(--accent); }
  nav { display: flex; gap: 4px; padding: 8px 12px 0; }
  nav button { flex: 1; cursor: pointer; padding: 6px; border-radius: 6px; border: 1px solid var(--line); background: none; color: var(--muted); font-size: 12px; }
  nav button.on { color: var(--accent); border-color: var(--accent); }
  input { margin: 8px 12px 0; width: calc(100% - 24px); padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--fg); }
  main { flex: 1; overflow: auto; padding: 10px 12px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 9px; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 12px; align-items: center; }
  h3 { margin: 0 0 4px; font-size: 14px; } h4 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }
  .chip { display: inline-block; padding: 2px 8px; margin: 2px; border-radius: 99px; background: rgba(255,255,255,.06); font-size: 12px; }
  button.code, a.link { cursor: pointer; border: 1px solid var(--accent); color: var(--accent); background: none; border-radius: 6px; padding: 2px 8px; font-size: 12px; text-decoration: none; }
  .status { font-size: 11px; color: var(--muted); margin-left: auto; }
  .team { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin: 8px 0 4px; }
  .player { display: grid; grid-template-columns: 32px 1fr auto; gap: 8px; align-items: center; border-left: 3px solid var(--line); }
  .player.enemy { border-left-color: var(--enemy); } .player.ally { border-left-color: var(--ally); }
  .player img, .avatar { width: 32px; height: 32px; border-radius: 6px; background: rgba(255,255,255,.06); object-fit: cover; }
  .wr-good { color: var(--ally); } .wr-bad { color: var(--enemy); }
  .muted { color: var(--muted); }
  .key { display:inline-block; min-width:80px; text-align:center; padding:6px 10px; border:1px solid var(--accent); border-radius:6px; color:var(--accent); cursor:pointer; background:none; }
  .key.listening { animation: pulse 1s infinite; } @keyframes pulse { 50% { opacity:.4 } }
  .item { position:relative; width:34px; height:34px; border-radius:6px; border:2px solid var(--line); background:rgba(255,255,255,.05); display:inline-flex; align-items:center; justify-content:center; overflow:hidden; font-size:9px; }
  .item img { width:100%; height:100%; object-fit:contain; }
  .item.weapon { border-color:#d18a3a; } .item.vitality { border-color:#5fae5a; } .item.spirit { border-color:#9a6fd6; } .item.active { border-color:#c9c3b6; }
  .items { display:flex; flex-wrap:wrap; gap:4px; }
  .counters { display:grid; gap:6px; } .counter { display:grid; grid-template-columns:34px 1fr; gap:8px; align-items:center; }
  .small { font-size:11px; margin-top:4px; }
  .hero { width:32px; height:32px; border-radius:6px; object-fit:cover; background:rgba(255,255,255,.06); }
  .hero.sm { width:22px; height:22px; vertical-align:middle; margin-right:4px; display:inline-block; }
  h3 { display:flex; align-items:center; }
  .filters { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  select { padding:5px 8px; border-radius:6px; border:1px solid var(--line); background:#1c1915; color:var(--fg); font-size:12px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; } .seg button { background:none; border:0; color:var(--muted); padding:5px 9px; cursor:pointer; font-size:12px; } .seg button.on { color:var(--accent); background:rgba(227,163,59,.1); }
  .star { background:none; border:0; color:var(--muted); font-size:18px; cursor:pointer; } .star.on { color:var(--accent); }
  body.is-main { border-radius:0; border:0; } body.is-main header { -webkit-app-region:no-drag; }
  .err { color: var(--enemy); font-size: 12px; } input[type=range] { margin:6px 0 0; width:100%; padding:0; }
.skills{display:flex;gap:2px;flex-wrap:wrap}.skill{width:18px;height:18px;border-radius:3px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#111}.skill.s1{background:#e8a33d}.skill.s2{background:#5fbf6e}.skill.s3{background:#a77be8}.skill.s4{background:#e8e3d4}img.hero.xs{width:26px;height:26px;border-radius:4px;object-fit:cover}button.code.on{outline:2px solid #e8a33d}
</style>
</head>
<body>
<header><b>Statslock</b> Companion <span class="status" id="status">Starting…</span><button id="close" title="Hide" style="-webkit-app-region:no-drag;background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px">×</button></header>
<nav></nav>
<input id="q" placeholder="Search hero…" style="display:none" />
<main id="list">Loading…</main>
<script src="main.js"></script>
</body>
</html>
