<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Statslock Companion</title>
<style>
  :root { --bg: rgba(14,12,10,.92); --fg: #f2ebe0; --muted: #a39887; --accent: #e3a33b; --line: rgba(255,255,255,.08); }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
  header b { color: var(--accent); }
  input { width: 100%; margin: 10px 12px 0; width: calc(100% - 24px); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--fg); }
  main { flex: 1; overflow: auto; padding: 10px 12px; }
  .hero { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  h3 { margin: 0 0 4px; } h4 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }
  .chip { display: inline-block; padding: 2px 8px; margin: 2px; border-radius: 99px; background: rgba(255,255,255,.06); font-size: 12px; }
  button.code { cursor: pointer; border: 1px solid var(--accent); color: var(--accent); background: none; border-radius: 6px; padding: 2px 8px; font-size: 12px; }
  .status { font-size: 12px; color: var(--muted); margin-left: auto; }
</style>
</head>
<body>
<header><b>Statslock</b> Companion <span class="status" id="status">Waiting for Deadlock…</span></header>
<input id="q" placeholder="Search hero…" autofocus />
<main id="list">Loading today's meta…</main>
<script src="main.js"></script>
</body>
</html>
